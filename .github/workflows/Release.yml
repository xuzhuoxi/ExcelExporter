# 发版流程、注意事项见同目录 Release.md
name: Release

# 仅在推送 tag 时触发。GitHub 无法把 branches 与 tags 组合成「只在 main 上打 tag」
#（二者为或关系，且分别匹配 refs/heads/* 与 refs/tags/*），因此用 tags 触发，再在 job 内校验提交是否在 main。
on:
  push:
    tags:
      - 'v*.*.*' # 例如 v1.0.3、v1.0.3-rc.1；1.0.3 / v1.0 不会触发

# 创建 Release、上传附件。GITHUB_TOKEN 由 GitHub 自动注入，无需在 Secrets 中配置。
# 发布者会显示为 github-actions[bot]，无法改成推 tag 的用户。
permissions:
  contents: write

env:
  APP_NAME: ExcelExporter

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要完整历史，才能判断 tag 提交是否为 main 的祖先

      # github.ref 在 tag 推送时是 refs/tags/...，不能用 if: github.ref == refs/heads/main
      - name: Ensure tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on the main branch."
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        # GITHUB_REF_NAME 为 tag 短名，如 v1.0.3
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          out_dir="${GITHUB_WORKSPACE}/dist"
          mkdir -p "${out_dir}"

          targets=(
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )

          for target in "${targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            bin_name="${APP_NAME}"
            if [[ "${goos}" == "windows" ]]; then
              bin_name="${bin_name}.exe"
            fi

            work_dir="$(mktemp -d)"
            echo "Building ${goos}/${goarch}..."
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "-s -w" -o "${work_dir}/${bin_name}" ./src

            cp LICENSE README.md README_EN.md "${work_dir}/"

            archive_base="${APP_NAME}_${version}_${goos}_${goarch}"
            if [[ "${goos}" == "windows" ]]; then
              (cd "${work_dir}" && zip -q "${out_dir}/${archive_base}.zip" ./*)
            else
              tar -C "${work_dir}" -czf "${out_dir}/${archive_base}.tar.gz" .
            fi
          done

          # 环境配置包：env_<tag>.zip，解压后根目录为 evn_<tag>/
          env_name="evn_${version}"
          env_stage="$(mktemp -d)"
          env_dir="${env_stage}/${env_name}"
          mkdir -p "${env_dir}"
          cp -a res/db res/lang res/proxy res/source res/template "${env_dir}/"
          cp -a res/excel.yaml res/project.yaml res/system.yaml "${env_dir}/"
          mkdir -p "${env_dir}/target"
          (cd "${env_stage}" && zip -qr "${out_dir}/env_${version}.zip" "${env_name}")

          (cd "${out_dir}" && sha256sum * > SHA256SUMS.txt)
          ls -lh "${out_dir}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 手写说明 notes/release/ReleaseNotes_<tag>.md 须与 tag 同名且已在被 tag 的提交中；
        # 有则置于正文最前（同 v1.0.2），再追加自动 notes。
        # 手写文件已含 **Full Changelog** 时，去掉自动 notes 中的同名行，避免重复。
        # tag 含 "-" 视为预发布（如 v1.0.3-rc.1）。
        # 已存在则覆盖附件并更新正文。
        run: |
          set -euo pipefail

          notes_file="notes/release/ReleaseNotes_${GITHUB_REF_NAME}.md"
          combined_notes="$(mktemp)"
          auto_notes="$(mktemp)"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body > "${auto_notes}"

          if [[ -f "${notes_file}" ]]; then
            cat "${notes_file}" > "${combined_notes}"
            printf '\n\n' >> "${combined_notes}"
            if grep -qF '**Full Changelog**' "${notes_file}"; then
              sed '/^\*\*Full Changelog\*\*/d' "${auto_notes}" >> "${combined_notes}"
            else
              cat "${auto_notes}" >> "${combined_notes}"
            fi
          else
            cat "${auto_notes}" > "${combined_notes}"
          fi

          prerelease_args=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${combined_notes}" \
              "${prerelease_args[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${combined_notes}" \
              "${prerelease_args[@]}"
          fi
